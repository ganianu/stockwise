
spring.application.name=stockwise

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/stockwise_db
spring.datasource.username=stockwise_user
spring.datasource.password=${STOCKWISE_DB_PASSWORD}

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing StockWise Schema

# Server Configuration
server.port=8080

# StockWise API Security
stockwise.security.username=${STOCKWISE_API_USERNAME}
stockwise.security.password=${STOCKWISE_API_PASSWORD}

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

spring.jpa.open-in-view=false